# SPDX-License-Identifier: Apache-2.0

description: |
  RTL8201F 100BASE-TX EtherCAT PHY.

  板卡 dts 写法：
    ecat_phy0: ethercat-phy@1 {
        compatible = "hpmicro,ecat-phy-rtl8201f";
        mdio-address = <1>;
        phy-mode = "mii";
        autoneg;
        advertise = <0x0100>;
    };

compatible: "hpmicro,ecat-phy-rtl8201f"

include: "hpmicro,ecat-phy.yaml"

properties:
  eee-enable:
    type: boolean
    description: |
      Keep the PHY's EEE (Energy Efficient Ethernet) capability enabled.
      Default off: EtherCAT requires a continuous MII clock, so the driver
      disables EEE unless this property is present.
